# Publish a GitHub release whenever a version tag is pushed.
#
#   git tag -a v0.2.0 -m "AgentCanvas v0.2.0" && git push origin v0.2.0
#
# The release title is the tag, its date is the push, and its notes are that version's
# section of CHANGELOG.md — so the changelog is written once and the Releases page
# never drifts from it. A tag with no matching section fails the job instead of
# publishing an empty release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract this version's notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## \[/ { if (found) exit; if (index($0, "## [" v "]") == 1) { found = 1; next } }
            found && /^\[[0-9]/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          cat notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "AgentCanvas $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag
