<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>12生肖 · 手绘童趣头像预览</title>
<style>
  :root { --card:#fffaf2; --page:#fbf2e6; --text:#3a332b; --muted:#8a7f72; --line:#efe4d4; }
  * { box-sizing:border-box; }
  body {
    margin:0; font:15px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    color:var(--text); background:var(--page); transition:background .25s,color .25s;
  }
  body[data-bg="dark"] { --card:#1a1f26; --page:#0f1319; --text:#eef1f6; --muted:#9aa6b6; --line:#252b35; }
  header { padding:40px 24px 4px; text-align:center; }
  h1 { margin:0 0 6px; font-size:22px; }
  header p { margin:0; color:var(--muted); font-size:13px; }
  .toolbar { display:flex; gap:8px; justify-content:center; margin:16px 0; flex-wrap:wrap; }
  .toolbar button { border:1px solid var(--line); background:var(--card); color:var(--text); border-radius:999px; padding:6px 14px; font-size:13px; cursor:pointer; }
  .toolbar button[data-active="true"] { background:var(--text); color:var(--page); border-color:var(--text); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:18px; max-width:960px; margin:20px auto 56px; padding:0 24px; }
  .cell { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:16px 12px 12px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:8px; }
  .av { width:104px; height:104px; display:block; }
  .name { font-size:13px; color:var(--muted); }
  .name b { color:var(--text); font-size:15px; margin-right:4px; }
  .sampler { max-width:960px; margin:0 auto 64px; padding:0 24px; }
  .sampler h2 { font-size:14px; color:var(--muted); font-weight:600; margin:0 0 12px; }
  .sampler .row { display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
  .sampler .row .av { width:40px; height:40px; }
  .sampler .row .av.s28 { width:28px; height:28px; }
</style>
</head>
<body data-bg="light">
<header>
  <h1>12 生肖 · 手绘童趣头像</h1>
  <p>风格:圆角方块底 · 大眼 · 柔白口鼻 · 腮红 · 微手绘边。原创草案,供选型。</p>
  <div class="toolbar">
    <button data-bg-btn="light" data-active="true">浅色背景</button>
    <button data-bg-btn="dark">深色背景</button>
  </div>
</header>

  <section class="grid" id="grid"></section>

    <div class="row" id="row28" style="margin-top:12px"></div>
  </section>
</main>

<script>
  const zodiac = [
    ["z-rat","鼠","Rat"],["z-ox","牛","Ox"],["z-tiger","虎","Tiger"],["z-rabbit","兔","Rabbit"],
    ["z-dragon","龙","Dragon"],["z-snake","蛇","Snake"],["z-horse","马","Horse"],["z-goat","羊","Goat"],
    ["z-monkey","猴","Monkey"],["z-rooster","鸡","Rooster"],["z-dog","狗","Dog"],["z-pig","猪","Pig"],
  ];
  const svg = (id,cls) => `<svg class="av ${cls||''}" viewBox="0 0 120 120"><use href="#${id}"/></svg>`;
  document.getElementById("grid").innerHTML = zodiac.map(([id,zh,en]) => `<div class="cell">${svg(id)}<div class="name"><b>${zh}</b>${en}</div></div>`).join("");
  document.getElementById("row40").innerHTML = zodiac.map(([id]) => svg(id)).join("");
  document.getElementById("row28").innerHTML = zodiac.map(([id]) => svg(id,"s28")).join("");
  document.querySelectorAll("[data-bg-btn]").forEach(btn => btn.addEventListener("click", () => {
    document.body.dataset.bg = btn.dataset.bgBtn;
    document.querySelectorAll("[data-bg-btn]").forEach(b => b.dataset.active = String(b === btn));
  }));
</script>

</html>
